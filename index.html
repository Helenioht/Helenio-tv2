<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helenio TV - WebTV Player Pro v6</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #070a13;
            --surface: #131a2c;
            --surface-light: #1e2942;
            --primary: #00d4ff;
            --accent: #ff2d55;
            --text: #f0f4ff;
            --text-muted: #8e9bb4;
            --hover: #223150;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--surface);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e2942;
            z-index: 100;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        
        .helenio-brand {
            font-size: 1.15rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.8));
            text-transform: uppercase;
        }

        .logo { font-size: 0.85rem; font-weight: 600; color: var(--primary); letter-spacing: 0.5px; opacity: 0.8; }
        .channel-count { background: var(--surface-light); padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; color: var(--text-muted); }

        .btn-header {
            background: var(--surface-light);
            color: var(--text);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-header:hover { background: var(--hover); }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .player-area {
            flex: 3;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .player-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .btn-control {
            background: rgba(7, 10, 19, 0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .btn-control:hover { background: var(--primary); color: #070a13; transform: scale(1.05); }

        .sidebar {
            width: 380px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1e2942;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.collapsed {
            width: 0px;
            min-width: 0;
            border-left: none;
            overflow: hidden;
        }

        .tabs { display: flex; background: #0d1322; padding: 4px; gap: 4px; }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab.active { background: var(--surface-light); color: var(--primary); font-weight: 600; }

        .controls { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        
        input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 6px;
            border: 1px solid #1e2942;
            background: #070a13;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn-primary {
            width: 100%;
            padding: 11px;
            background: var(--primary);
            color: #070a13;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 1px solid #1e2942;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: var(--hover); }

        .list-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--surface-light) var(--surface);
        }

        .list-wrapper::-webkit-scrollbar { width: 8px; }
        .list-wrapper::-webkit-scrollbar-track { background: var(--surface); }
        .list-wrapper::-webkit-scrollbar-thumb {
            background: var(--surface-light);
            border-radius: 4px;
            border: 1px solid var(--surface);
        }
        .list-wrapper::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .channel-item {
            padding: 12px 16px;
            margin: 2px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .channel-item:hover { background: var(--hover); }
        .channel-item.active { background: #162642; border-left: 4px solid var(--primary); }

        .channel-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 4px;
            background: #070a13;
            padding: 2px;
        }

        .channel-name { flex: 1; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .fav-icon {
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 1.1rem;
            transition: color 0.2s;
        }
        .fav-icon.active { color: #ffbc00; }

        .error-overlay {
            position: absolute;
            background: rgba(7, 10, 19, 0.96);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 85%;
            width: 400px;
            border: 1px solid rgba(255, 45, 85, 0.3);
            display: none;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--surface);
            padding: 24px;
            border-radius: 10px;
            width: 90%;
            max-width: 480px;
            border: 1px solid #1e2942;
        }
        .modal-content h2 { margin-bottom: 16px; font-size: 1.3rem; }

        .backup-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border-top: 1px solid #1e2942;
            padding-top: 15px;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 8px;
            color: var(--primary);
            min-height: 1.2em;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: 50vh; border-left: none; border-top: 1px solid #1e2942; }
            .sidebar.collapsed { height: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="helenio-brand">Helenio TV</div>
            <div class="logo">Pro v6</div>
            <div class="channel-count" id="countBadge">0 canais</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-header" onclick="toggleCinemaMode()">🎬 Modo Cinema</button>
            <button class="btn-header" onclick="showSettings()">⚙️ Configurações</button>
        </div>
    </header>

    <div class="main-container">
        <div class="player-area">
            <video id="videoPlayer" controls autoplay playsinline></video>
            
            <div class="player-controls">
                <button class="btn-control" onclick="toggleCinemaMode()" title="Alternar Menu">👁️</button>
                <button class="btn-control" onclick="toggleFullscreen()" title="Tela Cheia">⛶</button>
            </div>

            <div id="errorOverlay" class="error-overlay">
                <h3 style="color:var(--accent); margin-bottom: 8px;">Falha na reprodução</h3>
                <p id="errorMessage" style="font-size:0.9rem; color:var(--text-muted); margin-bottom:12px;"></p>
                <button class="btn-primary" onclick="retryPlay()" style="margin-top:15px;">Tentar Novamente</button>
            </div>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="tabs">
                <div class="tab active" onclick="switchTab(0)" id="tab0">Todos Canais</div>
                <div class="tab" onclick="switchTab(1)" id="tab1">Meus Favoritos</div>
            </div>

            <div class="controls">
                <input type="text" id="m3uUrl" placeholder="URL da lista M3U" value="https://iptv-org.github.io/iptv/countries/br.m3u">
                <button class="btn-primary" onclick="loadM3U()">🔄 Carregar Lista</button>
                <input type="text" id="searchInput" placeholder="🔍 Filtrar por nome..." oninput="filterChannels()">
            </div>

            <div class="list-wrapper">
                <ul id="channelList"></ul>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>Configurações & Backup</h2>
            <p style="font-size:0.85rem; color:var(--text-muted);">
                Sincronize seus canais favoritos na nuvem ou gerencie backups locais.
            </p>

            <div class="backup-section">
                <strong style="font-size:0.9rem; color: var(--primary);">Backup Remoto (Nuvem JSONBin)</strong>
                <button class="btn-secondary" onclick="uploadFavoritesToCloud()">☁️ Enviar Favoritos para Nuvem</button>
                <button class="btn-secondary" onclick="downloadFavoritesFromCloud()">☁️ Baixar Favoritos da Nuvem</button>
            </div>

            <div class="backup-section">
                <strong style="font-size:0.9rem; color: var(--primary);">Backup Local</strong>
                <button class="btn-secondary" onclick="exportFavoritesJSON()">💾 Exportar Arquivo .JSON</button>
                <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 Importar Arquivo .JSON</button>
                <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importFavoritesJSON(event)">
            </div>

            <div id="statusMessage" class="status-msg"></div>

            <button class="btn-primary" style="background:#475569; color:white; margin-top:10px;" onclick="closeModal(null)">Fechar Janela</button>
        </div>
    </div>

    <script>
        const MASTER_KEY = "$2a$10$cXJaZGoiDlDf7aL8aIElD.WznNlzWQYC9hyoDRXLZaEmGPiYV6lGS";
        const ACCESS_KEY = "$2a$10$gZT/ahG.y7XVGIXuodcyKulssYnan7fs6AiUXWBpcnWsfeRYvoR12";
        
        const video = document.getElementById('videoPlayer');
        const channelListEl = document.getElementById('channelList');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorMsg = document.getElementById('errorMessage');
        const countBadge = document.getElementById('countBadge');
        const statusMsg = document.getElementById('statusMessage');
        
        let hls = null;
        let channels = [];
        let favorites = JSON.parse(localStorage.getItem('favorites_v6')) || [];
        let currentChannel = null;
        let currentTab = 0;

        window.addEventListener('DOMContentLoaded', () => {
            const lastUrl = localStorage.getItem('lastM3uUrl_v6');
            if (lastUrl) {
                document.getElementById('m3uUrl').value = lastUrl;
            }
            loadM3U();
        });

        async function loadM3U() {
            const url = document.getElementById('m3uUrl').value.trim();
            if (!url) return alert("Insira uma URL válida!");

            localStorage.setItem('lastM3uUrl_v6', url);
            channelListEl.innerHTML = '<li style="padding:30px; text-align:center; color:var(--text-muted);">Processando requisição de dados...</li>';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Servidor não respondeu adequadamente.");
                const text = await response.text();
                parseM3U(text);
            } catch (err) {
                channelListEl.innerHTML = `<li style="padding:30px; color:var(--accent); text-align:center; font-size:0.9rem;">Falha na conexão externa.<br>Verifique políticas de CORS ou link expirado.</li>`;
                console.error(err);
            }
        }

        function parseM3U(data) {
            channels = [];
            const lines = data.split('\n');
            let current = null;

            for (let line of lines) {
                line = line.trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const name = line.split(',').pop().trim();
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    
                    current = {
                        name: name || "Canal sem Identificação",
                        logo: logoMatch ? logoMatch[1] : "",
                        url: ""
                    };
                } 
                else if (line.startsWith('http') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            }

            countBadge.textContent = `${channels.length} canais`;

            if (channels.length === 0) {
                channelListEl.innerHTML = '<li style="padding:30px; text-align:center; color:#ffcc00;">Nenhum fluxo encontrado no arquivo.</li>';
                return;
            }

            switchTab(currentTab);
            if (!currentChannel && channels.length > 0) {
                playChannel(channels[0]);
            }
        }

        function renderChannels(list) {
            channelListEl.innerHTML = '';
            if(list.length === 0) {
                channelListEl.innerHTML = '<li style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.9rem;">Nenhum item localizado.</li>';
                return;
            }

            const batchSize = 150;
            const renderBatch = (start) => {
                const end = Math.min(start + batchSize, list.length);
                const fragment = document.createDocumentFragment();

                for (let i = start; i < end; i++) {
                    const ch = list[i];
                    const isFav = favorites.some(f => f.url === ch.url);
                    
                    const li = document.createElement('li');
                    li.className = 'channel-item';
                    if (currentChannel && currentChannel.url === ch.url) li.classList.add('active');
                    
                    li.innerHTML = `
                        ${ch.logo ? `<img class="channel-logo" src="${ch.logo}" alt="" onerror="this.remove()">` : ''}
                        <div class="channel-name">${ch.name}</div>
                        <span class="fav-icon ${isFav ? 'active' : ''}">★</span>
                    `;
                    
                    li.onclick = (e) => {
                        if(e.target.classList.contains('fav-icon')) {
                            e.stopPropagation();
                            toggleFavorite(ch);
                        } else {
                            playChannel(ch);
                            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                            li.classList.add('active');
                        }
                    };
                    
                    fragment.appendChild(li);
                }

                channelListEl.appendChild(fragment);
                if (end < list.length) {
                    setTimeout(() => renderBatch(end), 5);
                }
            };

            renderBatch(0);
        }

        function filterChannels() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const sourceList = (currentTab === 1) ? favorites : channels;
            const filtered = sourceList.filter(ch => ch.name.toLowerCase().includes(term));
            renderChannels(filtered);
        }

        function playChannel(ch) {
            if (!ch || !ch.url) return;
            currentChannel = ch;
            errorOverlay.style.display = 'none';

            if (hls) hls.destroy();

            if (Hls.isSupported()) {
                hls = new Hls({
                    lowLatencyMode: true,
                    maxBufferLength: 10,
                    enableWorker: true,
                    maxBackBufferLength: 0
                });
                hls.loadSource(ch.url);
                hls.attachMedia(video);

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                showPlaybackError("O servidor de origem rejeitou a conexão pública ou alterou os tokens de segurança.");
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.addEventListener('error', () => {
                    showPlaybackError("Falha na decodificação do sinal de vídeo nativo.");
                });
            }
        }

        function showPlaybackError(msg) {
            errorMsg.textContent = msg;
            errorOverlay.style.display = 'block';
        }

        function retryPlay() {
            if (currentChannel) playChannel(currentChannel);
        }

        function toggleFavorite(ch) {
            const index = favorites.findIndex(f => f.url === ch.url);
            if (index >= 0) {
                favorites.splice(index, 1);
            } else {
                favorites.push(ch);
            }
            
            localStorage.setItem('favorites_v6', JSON.stringify(favorites));
            
            if(currentTab === 1) {
                renderChannels(favorites);
            } else {
                filterChannels();
            }
        }

        function switchTab(tabIndex) {
            currentTab = tabIndex;
            document.getElementById('tab0').classList.toggle('active', tabIndex === 0);
            document.getElementById('tab1').classList.toggle('active', tabIndex === 1);
            filterChannels();
        }

        function toggleCinemaMode() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function showSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
            statusMsg.textContent = '';
        }

        function closeModal(event) {
            if (!event || event.target.id === 'settingsModal') {
                document.getElementById('settingsModal').style.display = 'none';
            }
        }

        /* ==================== SISTEMA DE BACKUP CORRIGIDO (JSONBIN API v3) ==================== */

        async function createNewBin() {
            const response = await fetch(`https://api.jsonbin.io/v3/b`, {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY,
                    "X-Access-Key": ACCESS_KEY,
                    "X-Bin-Private": "true",
                    "X-Bin-Name": "HelenioTV_Favorites"
                },
                body: JSON.stringify({ favorites })
            });

            const data = await response.json();
            if (response.ok && data.metadata) {
                localStorage.setItem('jsonbin_id_v6', data.metadata.id);
                return data.metadata.id;
            } else {
                throw new Error(data.message || "Erro ao criar novo registro na nuvem.");
            }
        }

        async function uploadFavoritesToCloud() {
            let binId = localStorage.getItem('jsonbin_id_v6');
            statusMsg.textContent = "⏳ Conectando à nuvem...";

            try {
                if (!binId) {
                    await createNewBin();
                    statusMsg.textContent = "✅ Backup criado e salvo na nuvem!";
                    return;
                }

                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": MASTER_KEY,
                        "X-Access-Key": ACCESS_KEY
                    },
                    body: JSON.stringify({ favorites })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.textContent = "✅ Favoritos atualizados na nuvem!";
                } else if (response.status === 404) {
                    // Se o Bin não existir mais na conta, recria um novo
                    await createNewBin();
                    statusMsg.textContent = "✅ Novo backup gerado e sincronizado!";
                } else {
                    throw new Error(data.message || "Erro na resposta da API.");
                }
            } catch (err) {
                statusMsg.textContent = `❌ Falha no envio: ${err.message}`;
                console.error("Erro no upload:", err);
            }
        }

        async function downloadFavoritesFromCloud() {
            let binId = localStorage.getItem('jsonbin_id_v6');
            if (!binId) {
                statusMsg.textContent = "⚠️ Nenhum registro de backup encontrado no histórico deste navegador.";
                return;
            }

            statusMsg.textContent = "⏳ Baixando dados da nuvem...";

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    method: 'GET',
                    headers: {
                        "X-Master-Key": MASTER_KEY,
                        "X-Access-Key": ACCESS_KEY
                    }
                });

                const data = await response.json();
                if (response.ok && data.record && Array.isArray(data.record.favorites)) {
                    favorites = data.record.favorites;
                    localStorage.setItem('favorites_v6', JSON.stringify(favorites));
                    statusMsg.textContent = `✅ Sincronizado! ${favorites.length} favoritos restaurados.`;
                    if (currentTab === 1) renderChannels(favorites);
                } else {
                    throw new Error("Formato de dados incompatível ou registro vazio.");
                }
            } catch (err) {
                statusMsg.textContent = `❌ Falha ao baixar: ${err.message}`;
                console.error("Erro no download:", err);
            }
        }

        function exportFavoritesJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(favorites, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `heleniotv_favorites_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            statusMsg.textContent = "✅ Arquivo de backup exportado!";
        }

        function importFavoritesJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        favorites = imported;
                        localStorage.setItem('favorites_v6', JSON.stringify(favorites));
                        statusMsg.textContent = `✅ ${favorites.length} favoritos importados com sucesso!`;
                        if (currentTab === 1) renderChannels(favorites);
                    } else {
                        throw new Error("O arquivo selecionado não contém uma lista válida.");
                    }
                } catch (err) {
                    statusMsg.textContent = `❌ Erro na importação: ${err.message}`;
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
